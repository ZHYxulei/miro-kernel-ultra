name: Kernel CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison bc cpio zip unzip git ccache \
            device-tree-compiler kmod dwarves \
            libelf-dev libssl-dev libncurses-dev \
            perl python3 rsync xz-utils zstd

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-
            ccache-${{ runner.os }}-

      - name: Build kernel
        env:
          ANYKERNEL3_ZIP: miro-kernel-ultra-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip
        run: |
          chmod +x build.sh scripts/ci/verify-artifacts.sh
          JOBS="$(nproc)" bash build.sh zip

      - name: Verify artifacts
        run: |
          scripts/ci/verify-artifacts.sh out/dist
          cd out/dist
          sha256sum *.zip > SHA256SUMS

      - name: Upload flashable package
        uses: actions/upload-artifact@v4
        with:
          name: miro-kernel-ultra-${{ github.run_id }}
          path: |
            out/dist/*.zip
            out/dist/SHA256SUMS
            out/dist/Image
            out/dist/.config
            out/dist/System.map
            out/dist/vmlinux.symvers
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            out/build.log
            out/modules_install.log
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: miro-kernel-ultra-${{ github.run_id }}
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*.zip release-assets/SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/*.zip release-assets/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "miro-kernel-ultra ${GITHUB_REF_NAME}" \
              --notes "Redmi K80 Pro（24122RKC7C / miro）内核自动构建版本。集成 ReSukiSU、SUSFS，并通过 AnyKernel3 刷入 A/B 设备的 boot 分区。"
          fi
