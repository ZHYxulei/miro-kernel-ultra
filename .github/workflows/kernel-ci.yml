name: Kernel CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    # Nightly build at 18:00 UTC (02:00 Asia/Shanghai). An untested regression
    # then shows up on its own instead of at the next tag.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build_id: ${{ steps.build-id.outputs.build_id }}
      standard_zip: ${{ steps.build-id.outputs.standard_zip }}
      kpatch_zip: ${{ steps.build-id.outputs.kpatch_zip }}
      debug_zip: ${{ steps.build-id.outputs.debug_zip }}
      kpatch_debug_zip: ${{ steps.build-id.outputs.kpatch_debug_zip }}
      symbols_archive: ${{ steps.build-id.outputs.symbols_archive }}
      symbols_archive_debug: ${{ steps.build-id.outputs.symbols_archive_debug }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Script syntax, YAML and offline tests
        run: python3 -I scripts/ci/check-ci.py
      # 两个 runner 共用一次生成的标识，避免跨 UTC 日期时文件名不一致。
      - name: Resolve build id
        id: build-id
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            build_id="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            build_id="nightly-$(date -u +%Y%m%d)"
          else
            build_id="${GITHUB_SHA}"
          fi
          echo "build_id=${build_id}" >> "${GITHUB_OUTPUT}"
          echo "standard_zip=miro-kernel-ultra-${build_id}.zip" >> "${GITHUB_OUTPUT}"
          echo "kpatch_zip=miro-kernel-ultra-kpatch-exp-${build_id}.zip" >> "${GITHUB_OUTPUT}"
          echo "debug_zip=miro-kernel-ultra-debug-${build_id}.zip" >> "${GITHUB_OUTPUT}"
          echo "kpatch_debug_zip=miro-kernel-ultra-kpatch-exp-debug-${build_id}.zip" >> "${GITHUB_OUTPUT}"
          echo "symbols_archive=miro-kernel-ultra-debug-symbols-${build_id}.tar.zst" >> "${GITHUB_OUTPUT}"
          echo "symbols_archive_debug=miro-kernel-ultra-debug-kernel-symbols-${build_id}.tar.zst" >> "${GITHUB_OUTPUT}"

  # 独立 runner 并行编译；版本后缀在编译时写入模块 vermagic，不能事后修改。
  build-release:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github
      BUILD_VARIANT: release
      OUT_DIR: out
      LOCALVERSION: ""
      MODULES_TREE: modules_install_release
      KPATCH_TOOLCHAIN_DIR: out/kpatch-toolchain
      DEBUG_SYMBOLS_ARCHIVE: ${{ needs.preflight.outputs.symbols_archive }}
    outputs:
      standard_zip: ${{ needs.preflight.outputs.standard_zip }}
      kpatch_zip: ${{ needs.preflight.outputs.kpatch_zip }}
    # 仅复用步骤定义；执行环境、缓存、产物仍属于各自独立的 job。
    steps: &build-steps
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison bc cpio zip unzip git ccache \
            device-tree-compiler kmod dwarves \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev \
            perl python3 rsync xz-utils zstd

      - name: Validate build prerequisites
        run: |
          for tool in clang ld.lld llvm-strip flex bison bc cpio dtc zip unzip zstd; do
            command -v "$tool" >/dev/null
          done
          for fragment in arch/arm64/configs/gki_defconfig arch/arm64/configs/vendor/sun_perf.config arch/arm64/configs/vendor/miro_perf.config arch/arm64/configs/droidspaces.fragment; do
            test -s "$fragment"
          done
          git submodule status --recursive
          test -e KernelSU/.git && test -e AnyKernel3/.git && test -e KPatch-Next/.git
          mkdir -p "${OUT_DIR}"
          df -h .
          free -h

      # 分 variant 保存及恢复 ccache，避免两个 runner 并发写入同一 key。
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ env.BUILD_VARIANT }}-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.BUILD_VARIANT }}-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-
            ccache-${{ env.BUILD_VARIANT }}-${{ runner.os }}-

      - name: Cache KPatch toolchain
        uses: actions/cache@v6
        with:
          path: out/kpatch-toolchain
          key: kpatch-toolchain-12.2.rel1

      - name: Build kernel
        timeout-minutes: 110
        run: |
          chmod +x build.sh scripts/ci/verify-artifacts.sh scripts/ci/smoke-boot-test.sh
          mkdir -p "${OUT_DIR}"
          set -o pipefail
          { JOBS="$(nproc)" bash build.sh all && JOBS="$(nproc)" bash build.sh kpatch; } 2>&1 | tee "${OUT_DIR}/ci-build.log"

      # 只传递当前 variant 打包所需模块树，保留 build.sh 读取的目录布局。
      - name: Stage kernel outputs for packaging
        run: |
          rm -rf ci-kernel
          dest="ci-kernel/${OUT_DIR}"
          mkdir -p "${dest}/dist" "${dest}/arch/arm64/boot" ci-kernel/KPatch-Next/tools
          for file in Image Image-kpatch-next-exp dtb dtbo.img; do
            if [ -f "${OUT_DIR}/dist/${file}" ]; then
              cp -f "${OUT_DIR}/dist/${file}" "${dest}/dist/"
            fi
          done
          for file in Image dtbo.img dtb; do
            if [ -f "${OUT_DIR}/arch/arm64/boot/${file}" ]; then
              cp -f "${OUT_DIR}/arch/arm64/boot/${file}" "${dest}/arch/arm64/boot/"
            fi
          done
          cp -r "${OUT_DIR}/${MODULES_TREE}" "${dest}/${MODULES_TREE}"
          cp -f KPatch-Next/tools/kptools ci-kernel/KPatch-Next/tools/

      - name: Upload kernel outputs
        uses: actions/upload-artifact@v7
        with:
          name: miro-kernel-ultra-kernel-${{ env.BUILD_VARIANT }}-${{ github.run_id }}
          path: ci-kernel/
          if-no-files-found: error
          retention-days: 14

      # 两个 archive 和校验文件名不变；仅 release 携带同名原始元数据。
      - name: Stage debug symbols archives
        run: |
          rm -rf ci-symbols
          mkdir -p ci-symbols
          cp -f "${OUT_DIR}/dist/${DEBUG_SYMBOLS_ARCHIVE}" ci-symbols/
          sums_files=("${DEBUG_SYMBOLS_ARCHIVE}")
          if [ "${BUILD_VARIANT}" = release ]; then
            for file in Image System.map vmlinux.symvers .config; do
              if [ -f "${OUT_DIR}/dist/${file}" ]; then
                cp -f "${OUT_DIR}/dist/${file}" ci-symbols/
              fi
            done
            for file in System.map vmlinux.symvers; do
              if [ -f "ci-symbols/${file}" ]; then
                sums_files+=("${file}")
              fi
            done
            sums_name=SHA256SUMS-debug-symbols
          else
            sums_name=SHA256SUMS-debug-kernel-symbols
          fi
          ( cd ci-symbols && sha256sum "${sums_files[@]}" > "${sums_name}" )

      - name: Upload debug symbols archives
        uses: actions/upload-artifact@v7
        with:
          name: miro-kernel-ultra-symbols-${{ env.BUILD_VARIANT }}-${{ github.run_id }}
          path: ci-symbols/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Stage build logs
        if: always()
        run: |
          rm -rf ci-logs
          mkdir -p "ci-logs/${OUT_DIR}"
          found=0
          for file in build.log modules_install.log ci-build.log; do
            if [ -f "${OUT_DIR}/${file}" ]; then
              gzip -c "${OUT_DIR}/${file}" > "ci-logs/${OUT_DIR}/${file}.gz"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            printf '%s\n' 'No build logs: this build may not have started; inspect the workflow job/step logs.' > "ci-logs/${OUT_DIR}/not-started.txt"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ env.BUILD_VARIANT }}-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  build-debug:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github
      BUILD_VARIANT: debug
      OUT_DIR: out-debug
      LOCALVERSION: -debug
      MODULES_TREE: modules_install
      # runner 的文件系统独立，路径仍与工具链缓存保持一致。
      KPATCH_TOOLCHAIN_DIR: out/kpatch-toolchain
      DEBUG_SYMBOLS_ARCHIVE: ${{ needs.preflight.outputs.symbols_archive_debug }}
    outputs:
      debug_zip: ${{ needs.preflight.outputs.debug_zip }}
      kpatch_debug_zip: ${{ needs.preflight.outputs.kpatch_debug_zip }}
    steps: *build-steps

  # Release pair: standard + KPatch-Next EXP, modules stripped. Runs in parallel
  # with the debug packaging job.
  package-release:
    needs: build-release
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANYKERNEL3_ZIP: ${{ needs.build-release.outputs.standard_zip }}
      ANYKERNEL3_KPATCH_ZIP: ${{ needs.build-release.outputs.kpatch_zip }}
      MODULES_REF_DIR: ci-kernel/out/modules_install_release
      KPATCH_TOOLS: ci-kernel/KPatch-Next/tools/kptools
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-kernel-release-${{ github.run_id }}
          path: ci-kernel

      - name: Package release zips
        run: |
          chmod +x build.sh scripts/ci/verify-artifacts.sh
          chmod +x ci-kernel/KPatch-Next/tools/kptools
          OUT_DIR=ci-kernel/out bash build.sh package-release
          scripts/ci/verify-artifacts.sh "ci-kernel/out/dist/${ANYKERNEL3_ZIP}" standard
          scripts/ci/verify-artifacts.sh "ci-kernel/out/dist/${ANYKERNEL3_KPATCH_ZIP}" kpatch-exp

      - name: Stage release artifacts
        run: |
          rm -rf ci-release
          mkdir -p ci-release
          cp -f "ci-kernel/out/dist/${ANYKERNEL3_ZIP}" "ci-kernel/out/dist/${ANYKERNEL3_KPATCH_ZIP}" ci-release/
          standard_files=("${ANYKERNEL3_ZIP}")
          kpatch_files=("${ANYKERNEL3_KPATCH_ZIP}")
          # The raw images are published too so the kernel can be flashed by
          # hand (fastboot) without unpacking an AnyKernel3 ZIP.
          if [ -f ci-kernel/out/dist/Image ]; then
            cp -f ci-kernel/out/dist/Image ci-release/
            standard_files+=(Image)
          fi
          if [ -f ci-kernel/out/dist/Image-kpatch-next-exp ]; then
            cp -f ci-kernel/out/dist/Image-kpatch-next-exp ci-release/
            kpatch_files+=(Image-kpatch-next-exp)
          fi
          ( cd ci-release && sha256sum "${standard_files[@]}" > SHA256SUMS-standard )
          ( cd ci-release && sha256sum "${kpatch_files[@]}" > SHA256SUMS-kpatch-exp )

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: miro-kernel-ultra-release-${{ github.run_id }}
          path: ci-release/
          if-no-files-found: error
          retention-days: 14

  # Debug pair: same AnyKernel3 config, but the Image carries the -debug release
  # suffix and the modules keep their debug info so a crash address can be
  # resolved with objdump.
  package-debug:
    needs: build-debug
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANYKERNEL3_DEBUG_ZIP: ${{ needs.build-debug.outputs.debug_zip }}
      ANYKERNEL3_KPATCH_DEBUG_ZIP: ${{ needs.build-debug.outputs.kpatch_debug_zip }}
      MODULES_REF_DIR: ci-kernel/out-debug/modules_install
      KPATCH_TOOLS: ci-kernel/KPatch-Next/tools/kptools
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-kernel-debug-${{ github.run_id }}
          path: ci-kernel

      - name: Package debug zips
        run: |
          chmod +x build.sh scripts/ci/verify-artifacts.sh
          chmod +x ci-kernel/KPatch-Next/tools/kptools
          OUT_DIR=ci-kernel/out-debug bash build.sh package-debug
          scripts/ci/verify-artifacts.sh "ci-kernel/out-debug/dist/${ANYKERNEL3_DEBUG_ZIP}" debug
          scripts/ci/verify-artifacts.sh "ci-kernel/out-debug/dist/${ANYKERNEL3_KPATCH_DEBUG_ZIP}" debug-kpatch-exp

      - name: Stage debug artifacts
        run: |
          rm -rf ci-debug
          mkdir -p ci-debug
          cp -f "ci-kernel/out-debug/dist/${ANYKERNEL3_DEBUG_ZIP}" "ci-kernel/out-debug/dist/${ANYKERNEL3_KPATCH_DEBUG_ZIP}" ci-debug/
          ( cd ci-debug && sha256sum "${ANYKERNEL3_DEBUG_ZIP}" > SHA256SUMS-debug )
          ( cd ci-debug && sha256sum "${ANYKERNEL3_KPATCH_DEBUG_ZIP}" > SHA256SUMS-debug-kpatch-exp )

      - name: Upload debug packages
        uses: actions/upload-artifact@v7
        with:
          name: miro-kernel-ultra-debug-${{ github.run_id }}
          path: ci-debug/
          if-no-files-found: error
          retention-days: 14

  # Runs after both packaging jobs, because the Image that actually ends up on
  # the device is the one inside a ZIP, not the build-tree copy. Every published
  # package is unpacked and booted on its own, so a broken release package and a
  # broken debug package are told apart instead of hiding behind one another.
  smoke-test:
    needs: [package-release, package-debug]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install QEMU and cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm clang lld cpio unzip

      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-release-${{ github.run_id }}
          path: smoke-release

      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-debug-${{ github.run_id }}
          path: smoke-debug

      - name: Boot the Image inside every published package
        run: |
          chmod +x scripts/ci/smoke-boot-test.sh
          rm -rf smoke-images
          mkdir -p smoke-images
          for zip in smoke-release/*.zip smoke-debug/*.zip; do
            name="$(basename "${zip}" .zip)"
            unzip -p "${zip}" Image > "smoke-images/${name}.Image"
            test -s "smoke-images/${name}.Image"
          done
          ls -l smoke-images
          scripts/ci/smoke-boot-test.sh smoke-images/*.Image

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package-release, package-debug, smoke-test]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-release-${{ github.run_id }}
          path: release-assets/release

      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-debug-${{ github.run_id }}
          path: release-assets/debug

      # 文件名互不冲突，两份 symbols 下载到同一目录供发布使用。
      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-symbols-release-${{ github.run_id }}
          path: release-assets/symbols

      - uses: actions/download-artifact@v8
        with:
          name: miro-kernel-ultra-symbols-debug-${{ github.run_id }}
          path: release-assets/symbols

      - name: Generate bilingual release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/ci/release-notes.sh
          scripts/ci/release-notes.sh "${GITHUB_REF_NAME}" release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release-assets/release/*.zip
            release-assets/debug/*.zip
            release-assets/release/Image
            release-assets/release/Image-kpatch-next-exp
            release-assets/symbols/*.tar.zst
            release-assets/symbols/System.map
            release-assets/symbols/vmlinux.symvers
            release-assets/release/SHA256SUMS-standard
            release-assets/release/SHA256SUMS-kpatch-exp
            release-assets/debug/SHA256SUMS-debug
            release-assets/debug/SHA256SUMS-debug-kpatch-exp
            release-assets/symbols/SHA256SUMS-debug-symbols
            release-assets/symbols/SHA256SUMS-debug-kernel-symbols
          )
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" \
              --title "miro-kernel-ultra ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "miro-kernel-ultra ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
