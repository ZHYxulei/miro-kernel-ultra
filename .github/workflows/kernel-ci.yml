name: Kernel CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    # Nightly build at 18:00 UTC (02:00 Asia/Shanghai). An untested regression
    # then shows up on its own instead of at the next tag.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison bc cpio zip unzip git ccache \
            device-tree-compiler kmod dwarves \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev \
            perl python3 rsync xz-utils zstd

      - name: Resolve build id
        id: build-id
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            build_id="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            build_id="nightly-$(date -u +%Y%m%d)"
          else
            build_id="${GITHUB_SHA}"
          fi
          echo "build_id=${build_id}" >> "${GITHUB_OUTPUT}"
          echo "standard_zip=miro-kernel-ultra-${build_id}.zip" >> "${GITHUB_OUTPUT}"
          echo "kpatch_zip=miro-kernel-ultra-kpatch-exp-${build_id}.zip" >> "${GITHUB_OUTPUT}"
          echo "debug_archive=miro-kernel-ultra-debug-${build_id}.tar.zst" >> "${GITHUB_OUTPUT}"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-
            ccache-${{ runner.os }}-

      - name: Cache KPatch toolchain
        uses: actions/cache@v4
        with:
          path: out/kpatch-toolchain
          key: kpatch-toolchain-12.2.rel1

      - name: Build kernel
        env:
          ANYKERNEL3_ZIP: ${{ steps.build-id.outputs.standard_zip }}
          ANYKERNEL3_KPATCH_ZIP: ${{ steps.build-id.outputs.kpatch_zip }}
          DEBUG_SYMBOLS_ARCHIVE: ${{ steps.build-id.outputs.debug_archive }}
        run: |
          chmod +x build.sh scripts/ci/verify-artifacts.sh scripts/ci/smoke-boot-test.sh
          JOBS="$(nproc)" bash build.sh zip-dual

      - name: Verify artifacts
        env:
          STANDARD_ZIP: out/dist/${{ steps.build-id.outputs.standard_zip }}
          KPATCH_ZIP: out/dist/${{ steps.build-id.outputs.kpatch_zip }}
        run: |
          scripts/ci/verify-artifacts.sh "${STANDARD_ZIP}" standard
          scripts/ci/verify-artifacts.sh "${KPATCH_ZIP}" kpatch-exp

      - name: Stage artifacts
        run: |
          rm -rf ci-standard ci-kpatch ci-debug
          mkdir -p ci-standard ci-kpatch ci-debug
          cp -f "out/dist/${ANYKERNEL3_ZIP}" ci-standard/
          cp -f "out/dist/${ANYKERNEL3_KPATCH_ZIP}" ci-kpatch/
          cp -f "out/dist/${DEBUG_SYMBOLS_ARCHIVE}" ci-debug/
          # Bare filenames, so `sha256sum -c SHA256SUMS-standard` works straight
          # from the download directory on any platform.
          ( cd ci-standard && sha256sum "${ANYKERNEL3_ZIP}" > SHA256SUMS-standard )
          ( cd ci-kpatch && sha256sum "${ANYKERNEL3_KPATCH_ZIP}" > SHA256SUMS-kpatch-exp )
          ( cd ci-debug && sha256sum "${DEBUG_SYMBOLS_ARCHIVE}" > SHA256SUMS-debug )
          for file in Image .config System.map vmlinux.symvers; do
            if [ -f "out/dist/${file}" ]; then
              cp -f "out/dist/${file}" ci-standard/
            fi
          done
          if [ -f out/dist/Image-kpatch-next-exp ]; then
            cp -f out/dist/Image-kpatch-next-exp ci-kpatch/
          fi
        env:
          ANYKERNEL3_ZIP: ${{ steps.build-id.outputs.standard_zip }}
          ANYKERNEL3_KPATCH_ZIP: ${{ steps.build-id.outputs.kpatch_zip }}
          DEBUG_SYMBOLS_ARCHIVE: ${{ steps.build-id.outputs.debug_archive }}

      - name: Upload standard package
        uses: actions/upload-artifact@v4
        with:
          name: miro-kernel-ultra-standard-${{ github.run_id }}
          path: ci-standard/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload KPatch package
        uses: actions/upload-artifact@v4
        with:
          name: miro-kernel-ultra-kpatch-exp-${{ github.run_id }}
          path: ci-kpatch/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: miro-kernel-ultra-debug-${{ github.run_id }}
          path: ci-debug/
          if-no-files-found: error
          retention-days: 14

      - name: Stage build logs
        if: always()
        run: |
          rm -rf ci-logs
          mkdir -p ci-logs
          for file in build.log modules_install.log; do
            if [ -f "out/${file}" ]; then
              tail -n 200000 "out/${file}" | gzip -9 > "ci-logs/${file}.gz"
            fi
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU and cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm clang lld cpio

      - uses: actions/download-artifact@v4
        with:
          name: miro-kernel-ultra-standard-${{ github.run_id }}
          path: smoke-artifacts

      - name: Boot the produced kernel under QEMU
        run: |
          chmod +x scripts/ci/smoke-boot-test.sh
          scripts/ci/smoke-boot-test.sh smoke-artifacts/Image

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: miro-kernel-ultra-standard-${{ github.run_id }}
          path: release-assets/standard

      - uses: actions/download-artifact@v4
        with:
          name: miro-kernel-ultra-kpatch-exp-${{ github.run_id }}
          path: release-assets/kpatch-exp

      - uses: actions/download-artifact@v4
        with:
          name: miro-kernel-ultra-debug-${{ github.run_id }}
          path: release-assets/debug

      - name: Generate bilingual release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/ci/release-notes.sh
          scripts/ci/release-notes.sh "${GITHUB_REF_NAME}" release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release-assets/standard/*.zip
            release-assets/kpatch-exp/*.zip
            release-assets/debug/*.tar.zst
            release-assets/standard/SHA256SUMS-standard
            release-assets/kpatch-exp/SHA256SUMS-kpatch-exp
            release-assets/debug/SHA256SUMS-debug
          )
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" \
              --title "miro-kernel-ultra ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "miro-kernel-ultra ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
