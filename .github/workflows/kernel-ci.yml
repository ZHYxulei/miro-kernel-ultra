name: Kernel CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison bc cpio zip unzip git ccache \
            device-tree-compiler kmod dwarves \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev \
            perl python3 rsync xz-utils zstd

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/gki_defconfig', 'arch/arm64/configs/vendor/*.config', 'arch/arm64/configs/droidspaces.fragment') }}-
            ccache-${{ runner.os }}-

      - name: Cache KPatch toolchain
        uses: actions/cache@v4
        with:
          path: out/kpatch-toolchain
          key: kpatch-toolchain-12.2.rel1

      - name: Build kernel
        env:
          ANYKERNEL3_ZIP: miro-kernel-ultra-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip
          ANYKERNEL3_KPATCH_ZIP: miro-kernel-ultra-kpatch-exp-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip
        run: |
          chmod +x build.sh scripts/ci/verify-artifacts.sh
          JOBS="$(nproc)" bash build.sh zip-dual

      - name: Verify artifacts
        env:
          STANDARD_ZIP: out/dist/miro-kernel-ultra-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip
          KPATCH_ZIP: out/dist/miro-kernel-ultra-kpatch-exp-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip
        run: |
          scripts/ci/verify-artifacts.sh "${STANDARD_ZIP}" standard
          scripts/ci/verify-artifacts.sh "${KPATCH_ZIP}" kpatch-exp
          cd out/dist
          sha256sum *.zip > SHA256SUMS

      - name: Stage artifacts
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
          cp -f out/dist/*.zip out/dist/SHA256SUMS ci-artifacts/
          for file in Image Image-kpatch-next-exp .config System.map vmlinux.symvers; do
            if [ -f "out/dist/${file}" ]; then
              cp -f "out/dist/${file}" ci-artifacts/
            fi
          done

      - name: Upload flashable package
        uses: actions/upload-artifact@v4
        with:
          name: miro-kernel-ultra-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Stage build logs
        if: always()
        run: |
          rm -rf ci-logs
          mkdir -p ci-logs
          for file in build.log modules_install.log; do
            if [ -f "out/${file}" ]; then
              tail -n 200000 "out/${file}" | gzip -9 > "ci-logs/${file}.gz"
            fi
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: miro-kernel-ultra-${{ github.run_id }}
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*.zip release-assets/SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/*.zip release-assets/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "miro-kernel-ultra ${GITHUB_REF_NAME}" \
              --notes "Redmi K80 Pro（24122RKC7C / miro）双版本内核。标准版集成 ReSukiSU 与 SUSFS；kpatch-exp 版额外嵌入 KPatch-Next KPM 运行时。KPatch 版本属于实验构建，刷入前请备份 boot，启动与 KPM 兼容性需要实机验证。"
          fi
